<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f4f5}body{display:grid;place-items:center}canvas{display:block;width:100%!important;height:100%!important;object-fit:contain;cursor:zoom-in}</style></head>
<body><canvas id="previewCanvas" width="500" height="500"></canvas>
<script src="../sds-libs.dll.js"></script><script src="../sds-core.dll.js"></script><script src="../sds-app-runtime.js"></script><script src="../sds-vetrina-chunk.js"></script>
<script>
(function(){
  'use strict';
  window.SDSWebpackRequire(1007);var Renderer=window.SDSVetrina,engine=null,serial=0;
  function reply(type,detail){parent.postMessage({source:'hxpd-renderer',type:type,detail:detail||null},'*')}
  var nativeAtob=window.atob;window.atob=function(value){try{return nativeAtob.call(window,value)}catch(error){reply('error',{message:'Invalid renderer data: '+String(value).slice(0,180)});throw error}};
  function imageCanvas(source,width,height){return new Promise(function(resolve,reject){var image=new Image();image.onload=function(){var canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);resolve(canvas)};image.onerror=reject;image.src=source})}
  addEventListener('message',async function(event){var message=event.data;if(!message||message.source!=='hxpd-host')return;try{
    if(message.type==='init'){var id=++serial;if(engine)try{engine.clear()}catch(e){}var response=await fetch(message.sceneUrl),scenes=await response.json(),scene=scenes[message.viewId],previewSize=Math.max(1,Math.min(500,Math.floor(Math.min(window.innerWidth,window.innerHeight))));engine=new Renderer({id:'previewCanvas',type:'fixed-size',size:previewSize,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});engine.CDN_PREFIX=message.cdnPrefix;await engine.initPreview({psdData:scene,designSideList:message.sides});if(id===serial)reply('ready',{token:message.token});return}
    if(message.type==='render'&&engine){var surface=await imageCanvas(message.surface,message.width,message.height);await engine.renderPreview([{sideId:String(message.sideId),cropedCanvas:surface}]);var snapshot='';try{snapshot=document.getElementById('previewCanvas').toDataURL('image/png')}catch(e){}reply('rendered',{token:message.token,snapshot:snapshot})}
  }catch(error){reply('error',{message:String(error&&error.message||error),token:message.token})}});
  document.addEventListener('click',function(){var snapshot='';try{snapshot=document.getElementById('previewCanvas').toDataURL('image/png')}catch(e){}reply('expand',{snapshot:snapshot})},true);
  reply('loaded');
})();
</script></body></html>
