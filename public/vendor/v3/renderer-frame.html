  /* 移动端省显存：默认保留 #highResCanvas(1500²)；只有宿主明确说 mobile 才缩成 1×1（省约 8.6MB）。
     不能用自己的 window.innerWidth 判断——那是 iframe 的宽度，不是页面宽度。 */
  window.__hxHighResOff=false;
  function highResCanvas(){ return document.getElementById('highResCanvas'); }
  function shrinkHighRes(){
    var c=highResCanvas(); if(!c) return false;
    if(c.width===1&&c.height===1) return true;
    try{ c.width=1; c.height=1; }catch(e){}
    return true;
  }
  function applyMobile(off){
    window.__hxHighResOff=!!off;
    if(off){
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',shrinkHighRes);
      else shrinkHighRes();
    }
  }
  try{ if(/[?&]mobile=1/.test(location.search)) applyMobile(true); }catch(e){}
  addEventListener('message',function(e){
    var m=e.data;
    if(m&&m.source==='hxpd-host'&&m.type==='mobile-mode') applyMobile(!!m.mobile);
  },false);
})();
</script>
<script>
(function(){
  'use strict';
  /* 移动端省显存：宿主可通过 URL 参数锁定帧内的 devicePixelRatio（fabric 的"视网膜加倍"会在
     引擎初始化时读它，所以必须在引擎脚本之前设置）。默认不带参数 → 行为完全不变。 */

    var m=/[?&]dpr=(\d+(?:\.\d+)?)/.exec(location.search);
    if(m){
      var want=parseFloat(m[1]); if(!isFinite(want)||want<=0) want=1;

      window.__hxDprForced=want;
    }

})();
</script>

  async function highResSnapshot(){if(window.__hxHighResOff)return'';if(highResBusy||!currentScene||!currentInit||!currentSurface)return'';highResBusy=true;var highEngine=null,canvas=document.getElementById('highResCanvas');try{highEngine=new Renderer({id:'highResCanvas',type:'fixed-size',size:1000,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});highEngine.CDN_PREFIX=currentInit.cdnPrefix;var formatter=await formatterPayload();if(formatter)highEngine.globalRespText=formatter;await highEngine.initPreview({psdData:currentScene,designSideList:currentInit.sides});await waitForRender(canvas,highEngine.renderPreview(currentSurface),45000,'High-resolution render');await afterPaint();return canvas.toDataURL('image/png')}finally{try{if(highEngine)highEngine.clear()}catch(e){}highResBusy=false}}
  async function sendHighRes(){reply('highres-loading');var image='';try{image=await highResSnapshot()}catch(e){}if(!image)try{image=snapshot()}catch(e){}reply('expand',{snapshot:image})}

  async function handleBatch(message){
    var token=message.token,views=message.viewIds||[],specs=message.surfaces||[],out=new Array(views.length),
        size=Math.max(120,Math.min(1500,Number(message.outputSize)||1100)),
        type=message.outputType==='image/png'?'image/png':'image/webp',
        quality=Number(message.outputQuality)||0.92,
        timeout=Math.max(10000,Number(message.timeout)||60000);
    for(var i=0;i<views.length;i++){
      try{
        await activateScene({sceneUrl:message.sceneUrl,viewId:views[i],sides:message.sides,cdnPrefix:message.cdnPrefix,sceneItemRenderSize:message.sceneItemRenderSize});
        var activeEngine=engine,activeCanvas=currentCanvas,
            payload=await Promise.all(specs.map(async function(spec){
              if(spec.layerSpec&&spec.surface){
                var full=await imageCanvas(spec.surface);
                var layerSpec=(Number(spec.layerSpec.width)>0&&Number(spec.layerSpec.height)>0)?spec.layerSpec:{width:spec.width,height:spec.height};
                return{sideId:String(spec.sideId),cropedCanvas:cropCanvas(full,corpRectFor(activeEngine,layerSpec))};
              }
              return{sideId:String(spec.sideId),cropedCanvas:await imageCanvas(spec.surface,spec.width,spec.height)};
            }));
        currentSurface=payload;
        var baseline=visualSignature(activeCanvas),expectsChange=surfaceHasVisibleDesign(payload);
        await waitForRender(activeCanvas,activeEngine.renderPreview(payload),timeout,'Batch render',baseline,expectsChange);
        await afterPaint();
        out[i]=snapshot(activeCanvas,size,type,quality);
      }catch(e){
        out[i]=null;
        reply('batch-progress',{token:token,index:i,done:i+1,total:views.length,error:String(e&&e.message||e)});
        continue;
      }
      reply('batch-progress',{token:token,index:i,done:i+1,total:views.length});
    }
    reply('batch-rendered',{token:token,snapshots:out});
  }
  async function handleTask(message){var started=performance.now();if(message.type==='init'){var id=++serial;await activateScene(message);if(id===serial)reply('ready',{token:message.token,cached:engineCache.size>0,duration:Math.round(performance.now()-started)});return}if(message.type==='render'&&engine){var activeEngine=engine,activeCanvas=currentCanvas,specs=message.surfaces&&message.surfaces.length?message.surfaces:[message],decodedAt=performance.now(),payload=await Promise.all(specs.map(async function(spec){if(spec.layerSpec&&spec.surface){var full=await imageCanvas(spec.surface),layerSpec=(Number(spec.layerSpec.width)>0&&Number(spec.layerSpec.height)>0)?spec.layerSpec:{width:spec.width,height:spec.height};return{sideId:String(spec.sideId),cropedCanvas:cropCanvas(full,corpRectFor(activeEngine,layerSpec))}}return{sideId:String(spec.sideId),cropedCanvas:await imageCanvas(spec.surface,spec.width,spec.height)}})),renderedAt=performance.now(),timeout=Math.max(10000,Number(message.timeout)||30000),baseline=visualSignature(activeCanvas),expectsChange=surfaceHasVisibleDesign(payload);currentSurface=payload;await waitForRender(activeCanvas,activeEngine.renderPreview(payload),timeout,'Preview render',baseline,expectsChange);await afterPaint();var snapshotAt=performance.now(),image=snapshot(activeCanvas,message.outputSize,message.outputType,message.outputQuality);reply('rendered',{token:message.token,snapshot:image,crop:payload.map(function(item){try{return item.sideId+'='+item.cropedCanvas.width+'x'+item.cropedCanvas.height}catch(e){return item.sideId+'=?'}}).join(','),timing:{decode:Math.round(renderedAt-decodedAt),render:Math.round(snapshotAt-renderedAt),snapshot:Math.round(performance.now()-snapshotAt),total:Math.round(performance.now()-started)}})}}
  addEventListener('message',function(event){var message=event.data;if(!message||message.source!=='hxpd-host')return;if(message.type==='ping'){reply('loaded',{token:message.token});return}if(message.type==='preload'){preloadScenes(message).then(function(){reply('preloaded',{token:message.token})}).catch(function(error){reply('error',{message:String(error&&error.message||error),token:message.token})});return}if(message.type==='highres'){sendHighRes();return}if(message.type==='render-batch'){taskQueue=taskQueue.then(function(){return handleBatch(message)}).catch(function(error){reply('error',{message:String(error&&error.message||error),token:message.token})});return}taskQueue=taskQueue.then(function(){return handleTask(message)}).catch(function(error){reply('error',{message:String(error&&error.message||error),token:message.token})})});
  document.addEventListener('click',function(event){if(event.target&&event.target.id==='highResCanvas')return;reply('expand-request')},true);
  reply('loaded');
})();
