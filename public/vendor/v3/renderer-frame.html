<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f4f5}body{display:block}.canvas-container{width:1000px!important;height:1000px!important;max-width:none!important;max-height:none!important}canvas{display:block;width:1000px!important;height:1000px!important;max-width:none!important;max-height:none!important;background:#fff;cursor:zoom-in}</style></head>
<body><canvas id="previewCanvas" width="500" height="500"></canvas><canvas id="highResCanvas" width="1500" height="1500" aria-hidden="true" style="position:fixed!important;left:-1200px!important;top:0!important;width:1000px!important;height:1000px!important;pointer-events:none!important"></canvas>
<script src="../sds-libs.dll.js"></script><script src="../sds-core.dll.js"></script><script src="../sds-app-runtime.js"></script><script src="../sds-vetrina-chunk.js"></script>
<script>
(function(){
  'use strict';
  window.SDSWebpackRequire(1007);var Renderer=window.SDSVetrina,engine=null,currentCanvas=document.getElementById('previewCanvas'),serial=0,previewSize=500,currentScene=null,currentInit=null,currentSurface=null,highResBusy=false,sceneCache=new Map(),engineCache=new Map(),preloaded=new Set(),runtimeCanvasSerial=0;
  function reply(type,detail){parent.postMessage({source:'hxpd-renderer',type:type,detail:detail||null},'*')}
  var nativeAtob=window.atob;window.atob=function(value){try{return nativeAtob.call(window,value)}catch(error){reply('error',{message:'Invalid renderer data: '+String(value).slice(0,180)});throw error}};
  function imageCanvas(source,width,height){return new Promise(function(resolve,reject){var image=new Image();image.onload=function(){var canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);resolve(canvas)};image.onerror=reject;image.src=source})}
  function snapshot(){var source=currentCanvas,scale=source.width/1000,out=document.createElement('canvas');out.width=1000;out.height=1000;out.getContext('2d').drawImage(source,0,0,previewSize*scale,previewSize*scale,0,0,1000,1000);return out.toDataURL('image/png')}
  function scenesFor(url){if(!sceneCache.has(url))sceneCache.set(url,fetch(url).then(function(response){if(!response.ok)throw new Error('Scene request failed ('+response.status+')');return response.json()}));return sceneCache.get(url)}
  function archivedFrameName(name){return String(name||'').replace(/\.png$/i,'_600.png')}
  function preloadScenes(message){return scenesFor(message.sceneUrl).then(function(scenes){var ids=message.viewIds||Object.keys(scenes),urls=[];ids.forEach(function(id){var scene=scenes[id];(scene&&scene.psdFrames||[]).forEach(function(frame){if(frame&&frame.F){var url=message.cdnPrefix+archivedFrameName(frame.F);if(!preloaded.has(url)){preloaded.add(url);urls.push(url)}}})});return Promise.allSettled(urls.map(function(url){return new Promise(function(resolve){var image=new Image();image.onload=image.onerror=resolve;image.src=url})}))})}
  function canvasHost(canvas){return canvas.parentElement&&canvas.parentElement.classList.contains('canvas-container')?canvas.parentElement:canvas}
  function showCanvas(canvas){engineCache.forEach(function(entry){canvasHost(entry.canvas).style.display=entry.canvas===canvas?'block':'none'});canvasHost(canvas).style.display='block'}
  function evictEngines(limit,currentKey){while(engineCache.size>limit){var oldestKey=null,oldest=Infinity;engineCache.forEach(function(entry,key){if(key!==currentKey&&entry.used<oldest){oldest=entry.used;oldestKey=key}});if(oldestKey===null)return;var entry=engineCache.get(oldestKey);engineCache.delete(oldestKey);try{entry.engine.clear()}catch(e){}var host=canvasHost(entry.canvas);if(host&&host.parentNode)host.parentNode.removeChild(host)}}
  async function activateScene(message){var key=message.sceneUrl+'|'+message.viewId,cached=engineCache.get(key),limit=Math.max(1,Number(message.cacheLimit)||1);previewSize=Math.max(1,Math.min(500,Math.floor(Math.min(window.innerWidth,window.innerHeight))));if(cached&&message.forceRebuild){engineCache.delete(key);try{cached.engine.clear()}catch(e){}var staleHost=canvasHost(cached.canvas);if(staleHost&&staleHost.parentNode)staleHost.parentNode.removeChild(staleHost);cached=null}if(cached){cached.used=Date.now();engine=cached.engine;currentCanvas=cached.canvas;currentScene=cached.scene;currentInit=message;currentSurface=null;showCanvas(currentCanvas);evictEngines(limit,key);return}var scenes=await scenesFor(message.sceneUrl),scene=scenes[message.viewId];if(!scene)throw new Error('Preview scene not found: '+message.viewId);var baseCanvas=document.getElementById('previewCanvas'),canvas=engineCache.size===0&&baseCanvas?baseCanvas:document.body.appendChild(Object.assign(document.createElement('canvas'),{id:'previewCanvas-'+(++runtimeCanvasSerial),width:previewSize,height:previewSize})),nextEngine=new Renderer({id:canvas.id,type:'fixed-size',size:previewSize,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});nextEngine.CDN_PREFIX=message.cdnPrefix;await nextEngine.initPreview({psdData:scene,designSideList:message.sides});engine=nextEngine;currentCanvas=canvas;currentScene=scene;currentInit=message;currentSurface=null;engineCache.set(key,{engine:engine,canvas:canvas,scene:scene,used:Date.now()});showCanvas(canvas);evictEngines(limit,key)}
  async function highResSnapshot(){if(highResBusy||!currentScene||!currentInit||!currentSurface)return'';highResBusy=true;try{var highEngine=new Renderer({id:'highResCanvas',type:'fixed-size',size:1000,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});highEngine.CDN_PREFIX=currentInit.cdnPrefix;await highEngine.initPreview({psdData:currentScene,designSideList:currentInit.sides});var task=highEngine.renderPreview(currentSurface);await Promise.race([task,new Promise(function(resolve){setTimeout(resolve,8000)})]);var result=document.getElementById('highResCanvas').toDataURL('image/png');try{highEngine.clear()}catch(e){}return result}finally{highResBusy=false}}
  async function sendHighRes(){reply('highres-loading');var image='';try{image=await highResSnapshot()}catch(e){}if(!image)try{image=snapshot()}catch(e){}reply('expand',{snapshot:image})}
  addEventListener('message',async function(event){var message=event.data;if(!message||message.source!=='hxpd-host')return;if(message.type==='ping'){reply('loaded',{token:message.token});return}if(message.type==='preload'){preloadScenes(message).then(function(){reply('preloaded',{token:message.token})}).catch(function(){});return}if(message.type==='highres'){sendHighRes();return}try{
    if(message.type==='init'){var id=++serial;await activateScene(message);if(id===serial)reply('ready',{token:message.token,cached:engineCache.size>0});return}
    if(message.type==='render'&&engine){var specs=message.surfaces&&message.surfaces.length?message.surfaces:[message],payload=await Promise.all(specs.map(async function(spec){return{sideId:String(spec.sideId),cropedCanvas:await imageCanvas(spec.surface,spec.width,spec.height)}}));currentSurface=payload;var renderTask=engine.renderPreview(payload);await Promise.race([renderTask,new Promise(function(resolve){setTimeout(resolve,6000)})]);var image='';try{image=snapshot()}catch(e){}reply('rendered',{token:message.token,snapshot:image})}
  }catch(error){reply('error',{message:String(error&&error.message||error),token:message.token})}});
  document.addEventListener('click',function(event){if(event.target&&event.target.id==='highResCanvas')return;reply('expand-request')},true);
  reply('loaded');
})();
</script></body></html>
