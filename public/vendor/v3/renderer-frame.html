<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f4f5}body{display:block}.canvas-container{width:1000px!important;height:1000px!important;max-width:none!important;max-height:none!important}canvas{display:block;width:1000px!important;height:1000px!important;max-width:none!important;max-height:none!important;background:#fff;cursor:zoom-in}</style></head>
<body><canvas id="previewCanvas" width="500" height="500"></canvas><canvas id="highResCanvas" width="1500" height="1500" aria-hidden="true" style="position:fixed!important;left:-1200px!important;top:0!important;width:1000px!important;height:1000px!important;pointer-events:none!important"></canvas>
<script src="../sds-libs.dll.js"></script><script src="../sds-core.dll.js"></script><script src="../sds-app-runtime.js"></script><script src="../sds-vetrina-chunk.js"></script>
<script>
(function(){
  'use strict';
  window.SDSWebpackRequire(1007);var Renderer=window.SDSVetrina,engine=null,serial=0,previewSize=500,currentScene=null,currentInit=null,currentSurface=null,highResBusy=false;
  function reply(type,detail){parent.postMessage({source:'hxpd-renderer',type:type,detail:detail||null},'*')}
  var nativeAtob=window.atob;window.atob=function(value){try{return nativeAtob.call(window,value)}catch(error){reply('error',{message:'Invalid renderer data: '+String(value).slice(0,180)});throw error}};
  function imageCanvas(source,width,height){return new Promise(function(resolve,reject){var image=new Image();image.onload=function(){var canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(image,0,0,width,height);resolve(canvas)};image.onerror=reject;image.src=source})}
  function snapshot(){var source=document.getElementById('previewCanvas'),scale=source.width/1000,out=document.createElement('canvas');out.width=1000;out.height=1000;out.getContext('2d').drawImage(source,0,0,previewSize*scale,previewSize*scale,0,0,1000,1000);return out.toDataURL('image/png')}
  async function highResSnapshot(){if(highResBusy||!currentScene||!currentInit||!currentSurface)return'';highResBusy=true;try{var highEngine=new Renderer({id:'highResCanvas',type:'fixed-size',size:1000,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});highEngine.CDN_PREFIX=currentInit.cdnPrefix;await highEngine.initPreview({psdData:currentScene,designSideList:currentInit.sides});var task=highEngine.renderPreview([{sideId:String(currentSurface.sideId),cropedCanvas:currentSurface.canvas}]);await Promise.race([task,new Promise(function(resolve){setTimeout(resolve,8000)})]);var result=document.getElementById('highResCanvas').toDataURL('image/png');try{highEngine.clear()}catch(e){}return result}finally{highResBusy=false}}
  addEventListener('message',async function(event){var message=event.data;if(!message||message.source!=='hxpd-host')return;if(message.type==='ping'){reply('loaded',{token:message.token});return}try{
    if(message.type==='init'){var id=++serial;if(engine)try{engine.clear()}catch(e){}var response=await fetch(message.sceneUrl),scenes=await response.json(),scene=scenes[message.viewId];currentScene=scene;currentInit=message;currentSurface=null;previewSize=Math.max(1,Math.min(500,Math.floor(Math.min(window.innerWidth,window.innerHeight))));engine=new Renderer({id:'previewCanvas',type:'fixed-size',size:previewSize,platform:'sds',designCanvasSize:600,sceneItemRenderSize:1500});engine.CDN_PREFIX=message.cdnPrefix;await engine.initPreview({psdData:scene,designSideList:message.sides});if(id===serial)reply('ready',{token:message.token});return}
    if(message.type==='render'&&engine){var surface=await imageCanvas(message.surface,message.width,message.height);currentSurface={sideId:message.sideId,canvas:surface};var renderTask=engine.renderPreview([{sideId:String(message.sideId),cropedCanvas:surface}]);await Promise.race([renderTask,new Promise(function(resolve){setTimeout(resolve,6000)})]);var image='';try{image=snapshot()}catch(e){}reply('rendered',{token:message.token,snapshot:image})}
  }catch(error){reply('error',{message:String(error&&error.message||error),token:message.token})}});
  document.addEventListener('click',async function(event){if(event.target&&event.target.id==='highResCanvas')return;reply('highres-loading');var image='';try{image=await highResSnapshot()}catch(e){}if(!image)try{image=snapshot()}catch(e){}reply('expand',{snapshot:image})},true);
  reply('loaded');
})();
</script></body></html>
